version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: agency-os-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: agency-os
    networks:
      - agency-os-network

  redis:
    image: redis:7.2-alpine
    container_name: agency-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - agency-os-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agency-os-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    # NOTE: The environment block below overrides .env values.
    # We intentionally do NOT override MONGODB_URI here so the value
    # from backend/.env is used (your local MongoDB via host.docker.internal).
    # Only REDIS_URL is overridden to use the containerised Redis service.
    environment:
      REDIS_URL: redis://redis:6379
    # host.docker.internal works natively on Mac/Windows Docker Desktop.
    # On Linux this extra_hosts entry maps it to the host gateway IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - agency-os-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agency-os-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agency-os-network

volumes:
  mongo_data:
  redis_data:

networks:
  agency-os-network:
    driver: bridge
