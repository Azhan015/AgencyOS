version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: agency-os-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: agency-os
    networks:
      - agency-os-network

  redis:
    image: redis:7.2-alpine
    container_name: agency-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - agency-os-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agency-os-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/agency-os
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/src:/app/src
    networks:
      - agency-os-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agency-os-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - agency-os-network

volumes:
  mongo_data:
  redis_data:

networks:
  agency-os-network:
    driver: bridge
